name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build, unit, fuzz, scenarios (ASan/UBSan)
        run: make test

  tidy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: clang-tidy (advisory)
        run: make tidy

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make
      - name: Build CLI (bundled Lua)
        shell: msys2 {0}
        run: mingw32-make -f Makefile.win
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: yanas-net-cli-win64
          path: netsim.exe
